<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 링크 모음</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- 
    ==========================================
    📝 폰트 변경 방법 (Google Fonts 사용)
    ==========================================
    
    1. https://fonts.google.com 접속
    2. 원하는 폰트 2개 선택 (소개글용 + 본문용)
    3. 각 폰트의 스타일 선택 (Regular 400, Italic 등)
    4. 오른쪽 "View selected families" 클릭
    5. <link> 태그를 복사해서 아래 링크를 교체
    6. CSS의 font-family도 변경 (아래 CSS 섹션 참고)
    
    현재 사용 중:
    - Crimson Text (세리프, 우아한) - 소개글
    - Karla (산세리프, 깔끔한) - 본문, 링크
    
    추천 조합:
    ✨ 우아한: Playfair Display + Raleway
    ✨ 모던: Montserrat + Open Sans
    ✨ 따뜻한: Merriweather + Lato
    ✨ 심플: Roboto + Roboto (같은 폰트 사용)
    ✨ 독특한: Abril Fatface + Nunito
    ==========================================
    -->
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Karla:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #f9f6f0;
            --text-dark: #2a2520;
            --accent-rust: #c17855;
            --accent-sage: #8b9d83;
            --paper-white: #fffcf7;
            --shadow: rgba(42, 37, 32, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 
            📝 본문 폰트 변경:
            font-family: '새폰트이름', sans-serif;
            예: font-family: 'Montserrat', sans-serif;
            */
            font-family: 'Karla', sans-serif;
            /* 배경 이미지 사용 - background.jpg 파일을 같은 폴더에 업로드하세요 */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            /* 배경 이미지가 없을 때 표시될 기본 배경 */
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 배경 오버레이 - 배경 이미지 위에 살짝 어둡게 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(249, 246, 240, 0.7);
            /* 배경 이미지를 더 밝게 하려면 위 값을 0.8이나 0.9로 변경하세요 */
            /* 더 어둡게 하려면 0.5나 0.6으로 변경하세요 */
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 680px;
            width: 100%;
            background: var(--paper-white);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 
                0 4px 24px var(--shadow),
                0 0 1px rgba(42, 37, 32, 0.1);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 프로필 섹션 */
        .profile {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            border: 3px solid var(--accent-sage);
            padding: 4px;
            background: white;
            box-shadow: 0 8px 16px rgba(139, 157, 131, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-image:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 12px 24px rgba(139, 157, 131, 0.25);
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-title {
            font-family: 'Crimson Text', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .profile-subtitle {
            /* 
            📝 소개글 폰트 변경:
            font-family: '새폰트이름', serif;
            예: font-family: 'Playfair Display', serif;
            
            세리프(serif): 장식이 있는 우아한 폰트
            산세리프(sans-serif): 깔끔한 폰트
            */
            font-family: 'Crimson Text', serif;
            font-size: 1.4rem;
            color: var(--text-dark);
            font-style: italic;
            font-weight: 400;
            opacity: 0.95;
            line-height: 1.6;
        }

        /* 링크 섹션 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-item {
            position: relative;
            animation: slideIn 0.6s ease-out both;
        }

        .link-item:nth-child(1) { animation-delay: 0.3s; }
        .link-item:nth-child(2) { animation-delay: 0.4s; }
        .link-item:nth-child(3) { animation-delay: 0.5s; }
        .link-item:nth-child(4) { animation-delay: 0.6s; }
        .link-item:nth-child(5) { animation-delay: 0.7s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .link-item a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            background: white;
            border: 2px solid var(--accent-sage);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 400;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-item a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 157, 131, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .link-item a:hover::before {
            left: 100%;
        }

        .link-item a:hover {
            transform: translateX(8px);
            border-color: var(--accent-rust);
            background: linear-gradient(135deg, white 0%, #fdfbf8 100%);
            box-shadow: 0 8px 24px rgba(193, 120, 85, 0.15);
        }

        .link-text {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .link-icon {
            width: 24px;
            height: 24px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .link-item a:hover .link-icon {
            opacity: 1;
        }

        .link-arrow {
            font-size: 1.2rem;
            color: var(--accent-sage);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-item a:hover .link-arrow {
            transform: translateX(4px);
            color: var(--accent-rust);
        }

        /* 푸터 */
        .footer {
            text-align: center;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(139, 157, 131, 0.2);
            animation: fadeIn 1s ease-out 0.8s both;
        }

        .footer-text {
            font-size: 0.85rem;
            color: var(--accent-sage);
            font-weight: 300;
        }

        /* 반응형 */
        @media (max-width: 640px) {
            .container {
                padding: 2rem 1.5rem;
            }

            .profile-title {
                font-size: 1.75rem;
            }

            .link-item a {
                padding: 1rem 1.25rem;
                font-size: 0.95rem;
            }
        }

        /* 장식 요소 */
        .decorative-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-sage);
            opacity: 0.3;
        }

        .decorative-dot:nth-child(1) {
            top: 20px;
            right: 20px;
        }

        .decorative-dot:nth-child(2) {
            bottom: 20px;
            left: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 장식 요소 -->
        <div class="decorative-dot"></div>
        <div class="decorative-dot"></div>

        <!-- 프로필 섹션 -->
        <div class="profile">
            <div class="profile-image">
                <!-- profile.png 파일을 같은 폴더에 업로드하세요 -->
                <img src="profile.png" alt="프로필 이미지">
            </div>
            <p class="profile-subtitle">Write on a papier, prost to me</p>
        </div>

        <!-- 링크 섹션 -->
        <div class="links">
            <div class="link-item">
                <a href="https://notion.so" target="_blank">
                    <span class="link-text">
                        <svg class="link-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M4 4h16v16H4V4zm2 2v12h12V6H6z"/>
                        </svg>
                        포트폴리오 & 프로젝트 정보
                    </span>
                    <span class="link-arrow">→</span>
                </a>
            </div>

            <div class="link-item">
                <a href="#" target="_blank">
                    <span class="link-text">
                        <svg class="link-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                        문의하기
                    </span>
                    <span class="link-arrow">→</span>
                </a>
            </div>

            <div class="link-item">
                <a href="https://instagram.com" target="_blank">
                    <span class="link-text">
                        <svg class="link-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.39 5.61 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/>
                        </svg>
                        Instagram
                    </span>
                    <span class="link-arrow">→</span>
                </a>
            </div>

            <div class="link-item">
                <a href="mailto:your@email.com">
                    <span class="link-text">
                        <svg class="link-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                        Email
                    </span>
                    <span class="link-arrow">→</span>
                </a>
            </div>

            <div class="link-item">
                <a href="#" target="_blank">
                    <span class="link-text">
                        <svg class="link-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        더 많은 링크 추가
                    </span>
                    <span class="link-arrow">→</span>
                </a>
            </div>
        </div>

        <!-- 푸터 -->
        <div class="footer">
            <p class="footer-text">Made with ♡</p>
        </div>
    </div>
</body>
</html>
